<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Daily prices for about ninety indices, stocks, funds, rates, currencies, commodities and crypto, refreshed every night." />
    <title>Market data</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- D58: start the two first requests before the bundle runs; the build fills %VITE_API_URL% -->
    <link rel="preload" href="%VITE_API_URL%/api/overview" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="%VITE_API_URL%/api/runs" as="fetch" crossorigin="anonymous" />
    <script>
      (function () {
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") dark = saved === "dark";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
