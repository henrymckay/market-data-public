name: verify-secrets
# R8 after M7 (PLAN.md): counts each token, whole and in fragments, in every
# earlier run's log, the published site and a `wrangler tail` session over every
# endpoint and error. Only counts are printed; run it by hand.
on:
  workflow_dispatch:
concurrency:
  group: verify-secrets
  cancel-in-progress: false
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      API_URL: ${{ vars.API_URL }}
      SCAN_DIR: /tmp/scan
      SITE_URL: https://henrymckay.github.io/market-data-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run npm --prefix api ci --ignore-scripts
      - name: Tail the Worker while every endpoint and error is requested
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$SCAN_DIR"
          (cd api && npx wrangler tail market-data-api --format json) > "$SCAN_DIR/tail.log" 2>&1 &
          tail_pid=$!
          sleep 25
          req() { curl -s -o "$SCAN_DIR/resp-$1" -w "%{http_code} $2\n" "${@:3}" "$API_URL$2"; }
          req latest /api/latest
          req overview /api/overview
          req runs /api/runs
          req gspc /api/bars/gspc
          req slugs /api/bars/aapl
          req notfound /api/bars/nope
          req sql /api/sql
          req root /
          req cors /api/latest -H "Origin: https://henrymckay.github.io"
          req foreign /api/latest -H "Origin: https://example.com"
          req post /api/latest -X POST
          req etag /api/latest -H 'If-None-Match: "x"'
          sleep 15
          kill "$tail_pid" || true
          echo "tail log lines: $(wc -l < "$SCAN_DIR/tail.log")"
      - name: Collect every earlier run's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --limit 200 --json databaseId -q '.[].databaseId' |
            grep -v "^${GITHUB_RUN_ID}$" |
            while read -r id; do gh run view "$id" -R "$GITHUB_REPOSITORY" --log > "$SCAN_DIR/run-$id.log" 2>/dev/null || true; done
          ls "$SCAN_DIR"/run-*.log | wc -l
      - name: Collect the published site
        run: |
          mkdir -p "$SCAN_DIR/site"
          curl -sf "$SITE_URL/" -o "$SCAN_DIR/site/index.html"
          for _ in 1 2 3; do
            cat "$SCAN_DIR"/site/* | grep -oE '[A-Za-z0-9_./-]+\.(js|css)' | sed 's|^\./||; s|^/market-data-public/||; s|^assets/||' | sort -u |
              while read -r name; do
                [[ -f "$SCAN_DIR/site/$name" ]] || curl -sf "$SITE_URL/assets/$name" -o "$SCAN_DIR/site/$name" || true
              done
          done
          ls "$SCAN_DIR/site" | wc -l
      - name: Count each token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOTHERDUCK_API_TOKEN: ${{ secrets.MOTHERDUCK_API_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python3 scripts/scan_tokens.py "$SCAN_DIR" CLOUDFLARE_API_TOKEN MOTHERDUCK_API_TOKEN MOTHERDUCK_TOKEN
