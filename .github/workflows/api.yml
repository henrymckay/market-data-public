name: api
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:
concurrency:
  group: api
  cancel-in-progress: false
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run npm --prefix api ci --ignore-scripts
      - run: uv run npm --prefix api run typecheck
      - run: uv run npm --prefix api run lint
      - run: uv run npm --prefix api test
  # Deploys only once the owner has signed in to Cloudflare and set the secrets
  # and the repository variable API_URL (PLAN.md, M7); until then it is skipped.
  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && vars.API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run npm --prefix api ci --ignore-scripts
      # `secrets` uploads each named environment variable as a Worker secret
      # before the command runs, so the first deploy finds the secret that
      # wrangler.toml declares required (the value goes in on standard input).
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          secrets: MOTHERDUCK_TOKEN
          command: deploy
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_API_TOKEN }}
