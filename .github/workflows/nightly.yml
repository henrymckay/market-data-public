name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
concurrency:
  group: data
  cancel-in-progress: false
permissions: {}
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev market-data-cli nightly --log-level info
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - if: ${{ !cancelled() }}
        run: uv run --no-dev market-data-cli status --log-level info
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - run: uv run --no-dev market-data-cli export --output site-data
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-data
          path: site-data
          retention-days: 1
          if-no-files-found: error
  site:
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-data
          path: web/public/data
      - run: uv run npm --prefix web ci
      - run: uv run npm --prefix web run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
