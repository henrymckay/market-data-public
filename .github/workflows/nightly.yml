name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every instrument's whole history, as Sundays do
        type: boolean
        default: false
concurrency:
  group: data
  cancel-in-progress: false
permissions: {}
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: |
          flags=()
          if [[ "$(date -u +%u)" == 7 || "$FULL" == true ]]; then flags+=(--full); fi
          uv run --no-dev market-data-cli nightly --log-level info "${flags[@]}"
        env:
          FULL: ${{ inputs.full }}
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - if: ${{ !cancelled() }}
        run: uv run --no-dev market-data-cli status --log-level info
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
  # Fills the API's cache so no visitor waits on a miss (PLAN.md, D60, D98): the
  # featured instruments only. It holds no secret: every request is a public GET.
  warm:
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    env:
      API_URL: ${{ vars.API_URL }}
      STARTED: ${{ needs.nightly.outputs.started }}
    steps:
      - name: Wait for the API to see this run
        run: |
          for _ in $(seq 40); do
            version="$(curl -sf "$API_URL/api/latest?v=$(date +%s)" | jq -r '.version // empty')" || version=""
            echo "api version=${version:-none} nightly started=$STARTED"
            if [[ -n "$version" && ! "$version" < "$STARTED" ]]; then exit 0; fi
            sleep 30
          done
          echo "::error::the API's version never reached this run within 20 minutes"
          exit 1
      - name: Request every response once
        run: |
          fail=0
          for path in /api/overview /api/runs; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$API_URL$path")"
            echo "$code $path"
            [[ "$code" == 200 ]] || fail=1
          done
          slugs="$(curl -sf --max-time 60 "$API_URL/api/overview" | jq -r '.[] | select(.featured == true) | .slug')"
          [[ -n "$slugs" ]] || { echo "::error::no featured slugs in /api/overview"; exit 1; }
          export API_URL
          results="$(printf '%s\n' $slugs | xargs -P 4 -I{} sh -c 'echo "$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 "$API_URL/api/bars/{}") /api/bars/{}"')"
          echo "$results"
          [[ "$(grep -c -v '^200 ' <<<"$results")" == 0 ]] || fail=1
          exit "$fail"
