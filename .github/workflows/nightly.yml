name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every instrument's whole history, as Sundays do
        type: boolean
        default: false
concurrency:
  group: data
  cancel-in-progress: false
permissions: {}
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - id: run
        run: |
          flags=()
          if [[ "$(date -u +%u)" == 7 || "$FULL" == true ]]; then flags+=(--full); fi
          uv run --no-dev market-data-cli nightly --log-level info "${flags[@]}"
        env:
          FULL: ${{ inputs.full }}
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - if: ${{ !cancelled() }}
        run: uv run --no-dev market-data-cli status --log-level info
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      - name: Tell the owner a step before the command failed
        if: ${{ failure() && steps.run.outcome == 'skipped' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sf --max-time 10 -H "Title: Market data: nightly job broke" -H "Priority: 5" -H "Tags: warning" \
            -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -d "A step before the command ran failed in the nightly job; open the run." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
  # Fills the API's cache so no visitor waits on a miss (PLAN.md, D60, D98): the
  # featured instruments only. It holds no secret: every request is a public GET.
  warm:
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    env:
      API_URL: ${{ vars.API_URL }}
      STARTED: ${{ needs.nightly.outputs.started }}
    steps:
      - name: Wait for the API to see this run
        run: |
          for _ in $(seq 40); do
            version="$(curl -sf "$API_URL/api/latest?v=$(date +%s)" | jq -r '.version // empty')" || version=""
            echo "api version=${version:-none} nightly started=$STARTED"
            if [[ -n "$version" && ! "$version" < "$STARTED" ]]; then exit 0; fi
            sleep 30
          done
          echo "::error::the API's version never reached this run within 20 minutes"
          exit 1
      - name: Request every response once
        run: |
          fail=0
          for path in /api/overview /api/runs /api/signals /api/stats; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$API_URL$path")"
            echo "$code $path"
            [[ "$code" == 200 ]] || fail=1
          done
          featured="$(curl -sf --max-time 60 "$API_URL/api/overview" | jq -r '.[] | select(.featured == true) | .slug')"
          [[ -n "$featured" ]] || { echo "::error::no featured slugs in /api/overview"; exit 1; }
          signalled="$(curl -sf --max-time 60 "$API_URL/api/signals" | jq -r '(map(.known) | max) as $latest | .[] | select(.known == $latest) | .slug')" || signalled=""
          slugs="$(printf '%s\n%s\n' "$featured" "$signalled" | sort -u | sed '/^$/d')"
          echo "warming $(wc -l <<<"$slugs" | tr -d ' ') instruments"
          export API_URL
          results="$(printf '%s\n' $slugs | xargs -P 4 -I{} sh -c 'echo "$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 "$API_URL/api/bars/{}") /api/bars/{}"')"
          echo "$results"
          [[ "$(grep -c -v '^200 ' <<<"$results")" == 0 ]] || fail=1
          exit "$fail"
      - name: Tell the owner the warm job failed
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sf --max-time 10 -H "Title: Market data: warm job broke" -H "Priority: 5" -H "Tags: warning" \
            -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -d "The API did not show this night's data in time; open the run." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
  # Sends the night's pushes and digests, and a health message on a change of
  # state (PLAN.md, D91, D93); after warm so a tapped push opens a cached chart.
  notify:
    needs: [nightly, warm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - id: run
        run: uv run --no-dev market-data-cli notify --log-level info
        env:
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Tell the owner a step before the command failed
        if: ${{ failure() && steps.run.outcome == 'skipped' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sf --max-time 10 -H "Title: Market data: nightly job broke" -H "Priority: 5" -H "Tags: warning" \
            -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -d "A step before the command ran failed in the notify job; open the run." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
