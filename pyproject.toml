[project]
name = "market-data"
version = "0.1.0"
description = "Nightly daily prices from Yahoo into MotherDuck, with a static dashboard."
requires-python = ">=3.14"
dependencies = [
  "curl-cffi>=0.17.0",
  "duckdb>=1.5.6,<1.6",
  "lxml>=6.1.3",
  "matplotlib>=3.10",
  "numpy>=2.5.5",
  "pandas>=3.1.1",
  "polars>=2.1.0",
  "pyarrow>=26.0.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "pyrate-limiter>=4.5.1",
  "pyyaml>=6.0.3",
  "tenacity>=9.2.1",
  "typer>=0.29.1",
  "yfinance>=1.8",
]

[project.scripts]
market-data-cli = "market_data.code.drive.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage>=7.17.3",
  "hypothesis>=6.170.15",
  "nodejs-wheel>=24.19.0",
  "playwright>=1.65.2",
  "pre-commit>=4.7.0",
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "ruff>=0.17.5",
  "sqlfluff>=4.5.0",
  "taplo>=0.9.3",
  "time-machine>=3.6.0",
]

[tool.ruff]
extend-exclude = ["evaluation"]
force-exclude = true
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["TC001", "TC002", "TC003"]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "C4", "RUF", "PT", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
reportMissingTypeStubs = false
strict = ["src"]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--import-mode importlib --strict-config --strict-markers -p pytest_.given -m 'not real and not slow'"
filterwarnings = ["error"]
markers = [
  "real: runs against Yahoo, opt in with -m real",
  "slow: drives the built dashboard in a browser, opt in with -m slow",
]
pythonpath = ["tests"]
testpaths = ["tests/suite"]
xfail_strict = true

[tool.coverage.report]
exclude_also = ["typing.assert_never"]
fail_under = 97
show_missing = true

[tool.coverage.run]
branch = true
source = ["market_data"]

[tool.sqlfluff.core]
dialect = "duckdb"
max_line_length = 88
rules = "core, AL06, AM06"

[tool.sqlfluff.rules."aliasing.length"]
min_alias_length = 3

[tool.sqlfluff.rules."ambiguous.column_references"]
group_by_and_order_by_style = "explicit"

[tool.sqlfluff.rules."capitalisation.keywords"]
capitalisation_policy = "lower"

[tool.sqlfluff.rules."capitalisation.identifiers"]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules."capitalisation.functions"]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules."capitalisation.literals"]
capitalisation_policy = "lower"

[tool.sqlfluff.rules."capitalisation.types"]
extended_capitalisation_policy = "lower"
